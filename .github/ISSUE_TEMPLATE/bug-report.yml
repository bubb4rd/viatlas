name: Bug report
description: Something on the map or site is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the URL (it carries the camera position) if you can.
      placeholder: |
        1. Open …
        2. Switch to 3D …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, OS, and device
      placeholder: Chrome 142, macOS 26, M1 MacBook Air
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot or recording
