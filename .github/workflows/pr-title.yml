name: PR title

# Separate from CI so editing a title doesn't cancel or rerun the build.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: "Title follows `scope: outcome`"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-msg.mjs --title "$PR_TITLE"
