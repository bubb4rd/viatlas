version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      deckgl:
        patterns: ["@deck.gl/*", "@luma.gl/*", "@loaders.gl/*"]
      next-react:
        patterns:
          [
            "next",
            "react",
            "react-dom",
            "@types/react",
            "@types/react-dom",
            "babel-plugin-react-compiler",
          ]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
